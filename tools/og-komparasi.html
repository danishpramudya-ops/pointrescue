<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Komparasi Sistem — kartu pratinjau</title>
<!-- Dirender tools/buat-og.py menjadi assets/img/og-komparasi.jpg (1200 × 630).
     Gambar inilah yang muncul saat halaman komparasi dibagikan di WhatsApp, Instagram, LinkedIn.
     Isi tabel mini = isi tabel di komparasi/index.html; ubah keduanya bersama-sama. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,300..900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{ --ink:#03101f; --navy-900:#051a33; --navy:#093261; --navy-600:#0f4489; --blue:#2f7fe0; --blue-lt:#6fb0ff; --red:#d30e10; --orange:#e45a07; --paper:#eef2f7; }
*{ box-sizing:border-box; }
html,body{ margin:0; width:1200px; height:630px; overflow:hidden; background:var(--ink); color:var(--paper);
  font-family:"Archivo",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
svg{ fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.kartu{ position:relative; width:1200px; height:630px; overflow:hidden;
  background:
    radial-gradient(62% 95% at 18% 4%, rgba(47,127,224,.46), transparent 62%),
    radial-gradient(60% 85% at 102% 104%, rgba(15,68,137,.7), transparent 66%),
    var(--ink); }
.kontur{ position:absolute; inset:0; opacity:.62;
  background:url("../assets/img/kontur-gelap.svg") 30% 12% / 135% auto no-repeat;
  -webkit-mask-image:linear-gradient(100deg,#000 12%,transparent 88%); mask-image:linear-gradient(100deg,#000 12%,transparent 88%); }

.kiri{ position:absolute; left:72px; top:66px; width:610px; }
.logo{ display:flex; align-items:center; gap:18px; }
.logo img{ width:86px; height:86px; object-fit:contain; filter:drop-shadow(0 0 28px rgba(47,127,224,.6)); }
.logo span{ font:600 19px/1 "JetBrains Mono",monospace; letter-spacing:.3em; text-transform:uppercase; color:rgba(215,232,250,.72); }
.judul{ margin:30px 0 0; font:800 118px/.9 "Archivo",sans-serif; font-variation-settings:"wdth" 82; letter-spacing:-.032em; color:#fff; }
.sub{ margin:30px 0 0; font:600 22px/1.45 "JetBrains Mono",monospace; letter-spacing:.2em; text-transform:uppercase; color:rgba(215,232,250,.7); }
.sub b{ color:var(--orange); font-weight:700; }
.chips{ list-style:none; margin:26px 0 0; padding:0; display:flex; flex-wrap:wrap; gap:10px; }
.chips li{ font:500 17px/1 "JetBrains Mono",monospace; letter-spacing:.14em; text-transform:uppercase; color:rgba(205,226,255,.82);
  border:1.5px solid rgba(140,190,255,.34); border-radius:99px; padding:11px 17px; background:rgba(120,180,255,.08); }

/* tabel mini — tiga kolom, tiga baris, hasil yang sama dengan halamannya */
.mx{ position:absolute; right:60px; top:74px; width:486px; display:grid; grid-template-columns:150px repeat(3, 1fr); gap:10px; }
.mx > *{ border-radius:16px; }
.kosong{ border:1.5px solid rgba(140,190,255,.14); background:rgba(5,26,51,.45); height:124px;
  background-image:linear-gradient(to top right, transparent calc(50% - 1px), rgba(140,190,255,.3) calc(50% - 1px), rgba(140,190,255,.3) calc(50% + 1px), transparent calc(50% + 1px)); }
.sis{ height:124px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:8px; padding:10px 6px 12px;
  background:linear-gradient(rgba(120,180,255,.1), rgba(120,180,255,.04)), #061f3d; border:1.5px solid rgba(140,190,255,.26); text-align:center;
  font:800 16px/1.05 "Archivo",sans-serif; font-variation-settings:"wdth" 88; color:#fff; }
.sis svg{ width:54px; height:58px; color:rgba(150,196,250,.85); stroke-width:3; }
.sis img{ width:44px; height:54px; object-fit:contain; filter:drop-shadow(0 0 12px rgba(160,205,255,.6)); }
.sis--pr{ background:linear-gradient(165deg, #2c78d6, #0d3f80 80%); border-color:rgba(170,212,255,.7); box-shadow:0 26px 54px -26px rgba(47,127,224,.95); }
.sis--pr em{ font-style:normal; color:#ffb27a; }
.krit{ height:88px; padding:0 14px; display:flex; align-items:center; background:rgba(228,90,7,.12); border:1.5px solid rgba(228,90,7,.38);
  font:800 20px/1.12 "Archivo",sans-serif; font-variation-settings:"wdth" 88; color:#fff; }
.sel{ height:88px; display:grid; place-items:center; background:linear-gradient(rgba(120,180,255,.1), rgba(120,180,255,.04)), #061f3d; border:1.5px solid rgba(140,190,255,.26); }
.sel--pr{ background:linear-gradient(135deg, #2c78d6, #0f4489); border-color:rgba(170,212,255,.6); }
.tanda{ width:52px; height:52px; border-radius:50%; display:grid; place-items:center; }
.tanda svg{ width:30px; height:30px; stroke-width:3.4; }
.ya{ background:rgba(111,176,255,.14); color:var(--blue-lt); box-shadow:inset 0 0 0 2px rgba(111,176,255,.6); }
.sel--pr .ya{ background:#fff; color:var(--navy-600); box-shadow:none; }
.tdk{ background:var(--red); color:#fff; }

/* police line di dasar kartu */
.pita{ position:absolute; left:-6%; right:-6%; height:43px; background:url("../assets/img/policeline.png") repeat-x 0 center; background-size:auto 43px;
  filter:drop-shadow(0 12px 26px rgba(0,0,0,.55)); }
.pita.a{ bottom:30px; transform:rotate(-1.8deg); background-position-x:-180px; }
.pita.b{ bottom:-2px; transform:rotate(1.4deg); background-position-x:-520px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-ok" viewBox="0 0 24 24"><path d="M5.5 12.8l4.2 4.2L18.5 8"/></symbol>
    <symbol id="i-no" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></symbol>
    <symbol id="p-ht" viewBox="0 0 120 130">
      <path d="M80 40V10" stroke-width="7"/><path d="M45 40V29" stroke-width="6"/>
      <rect x="34" y="40" width="56" height="84" rx="11"/>
      <path d="M46 56h32M46 65h32M46 74h32M46 83h32"/><rect x="46" y="96" width="32" height="14" rx="3"/><path d="M27 66v26" stroke-width="6"/>
    </symbol>
    <symbol id="p-mesh" viewBox="0 0 120 130">
      <path d="M82 46L97 9" stroke-width="7"/>
      <rect x="24" y="46" width="72" height="78" rx="12"/><rect x="35" y="57" width="50" height="34" rx="4"/>
      <path d="M42 68h24M42 76h36M42 84h16" stroke-width="2.4" opacity=".7"/>
      <circle cx="44" cy="108" r="4.5"/><circle cx="60" cy="108" r="4.5"/><circle cx="76" cy="108" r="4.5"/>
      <path d="M31 46c-6-13 0-23 11-23" stroke-width="2.4" opacity=".6"/>
    </symbol>
  </defs>
</svg>

<div class="kartu">
  <div class="kontur"></div>

  <div class="kiri">
    <div class="logo"><img src="../assets/img/logo-mark.png" alt=""><span>PKM-KC 2026</span></div>
    <h1 class="judul" style="margin-bottom:0">Komparasi<br>Sistem</h1>
    <p class="sub">Pull &amp; Play <b>·</b> Dashboard <b>·</b> Biaya</p>
    <ul class="chips"><li>Point Rescue</li><li>Handy Talky</li><li>Meshtastic</li></ul>
  </div>

  <div class="mx">
    <div class="kosong"></div>
    <div class="sis sis--pr"><img src="../assets/img/logo-mark.png" alt=""><span>Point<em>Rescue</em></span></div>
    <div class="sis"><svg><use href="#p-ht"/></svg><span>Handy<br>Talky</span></div>
    <div class="sis"><svg><use href="#p-mesh"/></svg><span>Mesh&shy;tastic</span></div>

    <div class="krit">Pull &amp; Play</div>
    <div class="sel sel--pr"><span class="tanda ya"><svg><use href="#i-ok"/></svg></span></div>
    <div class="sel"><span class="tanda tdk"><svg><use href="#i-no"/></svg></span></div>
    <div class="sel"><span class="tanda tdk"><svg><use href="#i-no"/></svg></span></div>

    <div class="krit">Dashboard Pencarian</div>
    <div class="sel sel--pr"><span class="tanda ya"><svg><use href="#i-ok"/></svg></span></div>
    <div class="sel"><span class="tanda tdk"><svg><use href="#i-no"/></svg></span></div>
    <div class="sel"><span class="tanda ya"><svg><use href="#i-ok"/></svg></span></div>

    <div class="krit">Hemat Biaya</div>
    <div class="sel sel--pr"><span class="tanda ya"><svg><use href="#i-ok"/></svg></span></div>
    <div class="sel"><span class="tanda ya"><svg><use href="#i-ok"/></svg></span></div>
    <div class="sel"><span class="tanda tdk"><svg><use href="#i-no"/></svg></span></div>
  </div>

  <div class="pita a"></div>
  <div class="pita b"></div>
</div>
</body>
</html>
