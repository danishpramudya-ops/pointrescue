<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pembanding · model 3D generik</title>
<!--
  Halaman kerja, bukan bagian situs. Dipakai tools/render-pembanding.py untuk
  mengeluarkan PNG berlatar transparan dua perangkat pembanding di halaman
  Komparasi Sistem:

      ?m=ht     Handy Talky   — radio genggam dua-band generik
      ?m=mesh   node mesh     — node LoRa genggam generik dengan layar e-paper

  Keduanya MODEL GENERIK buatan sendiri dari bentuk dasar (kotak membulat,
  silinder), BUKAN tiruan produk atau merek tertentu: tidak ada logo, tidak
  ada tulisan, ukurannya hanya perkiraan jenisnya. Karena itu aman dipakai tanpa
  izin foto siapa pun — dan situs menyebutnya "ilustrasi 3D generik".
  Kodenya di proto/versus-model.js, dipakai bersama model hidup di situs.

  Panggungnya mesin 3D tim yang sama dengan render Point Rescue (proto/three-d-stage.js,
  tidak diubah): cahaya studio yang sama, kamera yang sama, jadi ketiga perangkat
  di tabel tampil serumpun. Warnanya sengaja satu keluarga slate-biru seperti
  casing Point Rescue setelah "diangkat" — di atas latar navy, hitam pekat
  akan hilang siluetnya.

  Semua kendali diekspos ke window.__pb supaya bisa disetir dari Playwright.
-->
<script type="importmap">
{
  "imports": {
    "three": "../vendor/three/build/three.module.min.js",
    "three/addons/controls/OrbitControls.js": "../vendor/three/examples/jsm/controls/OrbitControls.js",
    "three/addons/loaders/OBJLoader.js": "../vendor/three/examples/jsm/loaders/OBJLoader.js",
    "three/addons/exporters/OBJExporter.js": "../vendor/three/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "../vendor/three/examples/jsm/exporters/GLTFExporter.js"
  }
}
</script>
<style>
  html,body{ height:100%; margin:0; background:transparent; overflow:hidden; }
  three-d-stage{ display:block; width:100vw; height:100vh; pointer-events:none; }
  three-d-stage:not(:defined){ visibility:hidden; }
</style>
</head>
<body>

<three-d-stage id="stage" name="pembanding" background="transparent"></three-d-stage>

<script src="../proto/three-d-stage.js"></script>
<script type="module">
  const stage = document.getElementById('stage');
  const { THREE } = await stage.ready;

  const q = new URLSearchParams(location.search);
  const NAMA = q.get('m') === 'mesh' ? 'mesh' : 'ht';

  /* modelnya di proto/versus-model.js — dipakai bersama model hidup di situs */
  const { buat } = await import('../proto/versus-model.js');
  const F = buat(THREE);

  const model = F[NAMA]();
  const putaran = new THREE.Group();
  putaran.add(model);
  stage.setObject(putaran);

  /* seperti render Point Rescue: toolbar unduh, keterangan orbit, dan bayangan
     lantai dibuang supaya PNG-nya bersih */
  ['.toolbar', '.note'].forEach((sel) => {
    const n = stage.shadowRoot && stage.shadowRoot.querySelector(sel);
    if (n) n.remove();
  });
  if (stage._controls) { stage._controls.enabled = false; stage._controls.autoRotate = false; }
  if (stage._ground) stage._ground.visible = false;
  if (stage._key) stage._key.intensity = Number(q.get('key')) || 2.7;

  /* pose + kamera: berdiri miring seperti unit Point Rescue di poster */
  function pasang(o = {}) {
    const BAWAAN = F.POSE[NAMA];
    const rx = o.rx ?? Number(q.get('rx') ?? BAWAAN.rx), ry = o.ry ?? Number(q.get('ry') ?? BAWAAN.ry), rz = o.rz ?? Number(q.get('rz') ?? BAWAAN.rz);
    putaran.rotation.set(rx, ry, rz);
    putaran.updateMatrixWorld(true);
    const kotak = new THREE.Box3().setFromObject(putaran);
    const bola = kotak.getBoundingSphere(new THREE.Sphere());
    const arah = new THREE.Vector3(o.cx ?? Number(q.get('cx') ?? BAWAAN.cx), o.cy ?? Number(q.get('cy') ?? BAWAAN.cy), 1).normalize();
    const jarak = (bola.radius / Math.tan((stage._camera.fov * Math.PI) / 360)) * (o.isi ?? Number(q.get('isi') ?? 1.06));
    stage._camera.position.copy(bola.center).add(arah.multiplyScalar(jarak));
    stage._camera.near = jarak / 100; stage._camera.far = jarak * 100;
    stage._camera.updateProjectionMatrix();
    stage._controls.target.copy(bola.center);
    stage._controls.update();
  }

  window.__pb = {
    nama: NAMA,
    pasang,
    tunggu(n) {
      return new Promise((res) => {
        let i = 0;
        (function tik() { if (++i >= (n || 4)) return res(true); requestAnimationFrame(tik); })();
      });
    }
  };

  pasang();
  document.title = 'siap';
</script>
</body>
</html>
